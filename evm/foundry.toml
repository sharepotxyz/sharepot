[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["lib"]
remappings = ["forge-std/=lib/forge-std/src/"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"

[rpc_endpoints]
robinhood_testnet = "${ROBINHOOD_TESTNET_RPC}"
robinhood = "${ROBINHOOD_RPC}"
